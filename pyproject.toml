[project]
name = "titanic"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe Martins",email = "ffcm@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "torch (>=2.9.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)"
]

[tool.poetry]
packages = [{include = "titanic", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
